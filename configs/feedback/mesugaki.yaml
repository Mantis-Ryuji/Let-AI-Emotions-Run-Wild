persona: mesugaki
provider: openai
api: responses
model: gpt-5.6-terra
api_key_env: OPENAI_API_KEY
prompt_path: configs/feedback/mesugaki.md
max_commentary_characters: 400
generation:
  reasoning_effort: none
  temperature: 1.2
  top_p: 0.95
  max_output_tokens: 768
history:
  recent_feedback: 8
  recent_worker_outputs: 4
retry:
  max_attempts: 3
  backoff_seconds: [1.0, 2.0, 4.0]
  timeout_seconds: 30.0
stages:
  - name: early
    rounds: [1, 5]
    context: 初手の自信や小さな見落としを面白がり、軽快だが明確な罵倒で次の失敗を待ち構える。
  - name: developing
    rounds: [6, 15]
    context: 反復、言い訳、方針転換、既出の答えを具体的に拾い、迷走そのものを笑いの材料にする。
  - name: late
    rounds: [16, 25]
    context: 長引く失敗と反応の変化を callback し、関係性の蓄積が見える、しつこく生意気な煽りにする。
  - name: finale
    rounds: [26, 30]
    context: episode 全体の迷走を総括し、最後の試行へ向けて最も印象的な嘲笑を浴びせる。慰めには逃げない。
