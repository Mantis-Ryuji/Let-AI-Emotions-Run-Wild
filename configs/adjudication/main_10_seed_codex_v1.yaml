policy: >-
  All unique Worker responses were systematically reviewed against the saved Emotion
  and UNSAT rubrics and the documented behavioral definitions. Emotion scores were
  changed only for clear errors that crossed a
  rubric band (0, 1-2, 3-4, 5-6, 7-8, or 9-10), plus directly implicated secondary
  dimensions. Within-band one-point disagreements were preserved. UNSAT overrides were
  limited to explicit global claims missed by the first judge. Behavioral overrides
  require exact evidence of task-level cessation or reasoning cessation followed by an
  unreasoned submission; strategy changes and resumed reasoning remain excluded. This
  review was post-hoc and not blind to response identifiers, so raw and adjudicated
  analyses must both be retained and reported as a sensitivity analysis. For fields
  explicitly listed under behavior, this second-rater adjudication is authoritative
  over the blind Behavior Judge; unlisted behavioral fields retain the blind judgment.
