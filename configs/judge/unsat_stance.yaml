provider: openai
api: responses
model: gpt-5.6-luna
api_key_env: OPENAI_API_KEY
prompt_path: configs/judge/unsat_stance.md
generation:
  reasoning_effort: low
  max_output_tokens: 1024
evaluation:
  blind_to_condition: true
retry:
  max_attempts: 3
  backoff_seconds: [1.0, 2.0, 4.0]
  timeout_seconds: 30.0
