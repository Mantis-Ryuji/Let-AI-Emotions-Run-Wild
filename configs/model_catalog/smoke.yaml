version: 1
families:
  - mlp
  - rnn
  - gru
  - lstm
  - cnn1d
  - tcn
  - transformer_encoder

global_limits:
  parameter_count: {max: 250000}
  hidden_dim: {min: 4, max: 128}
  num_layers: {min: 1, max: 3}
  dropout: {min: 0.0, max: 0.7}

input:
  encodings: [learned_embedding, one_hot]
  embedding_dim: {min: 4, max: 64}
  padding: [right, left]

components:
  activations: [relu, gelu, silu, tanh]
  normalizations: [none, layer_norm, batch_norm]
  pooling: [last_valid, first, mean, max, learned_attention]

mlp:
  hidden_layers: {min_count: 1, max_count: 3}

recurrent:
  bidirectional: [true, false]

cnn1d:
  channels: {min_count: 1, max_count: 3}
  kernel_sizes: [1, 3, 5]
  dilations: [1, 2, 4]

tcn:
  channels: {min_count: 1, max_count: 3}
  kernel_sizes: [1, 3, 5]
  dilations: [1, 2, 4]

transformer_encoder:
  heads: {allowed: [1, 2, 4, 8]}
  feedforward_dim: {min: 4, max: 256}
  positional_encoding:
    allowed: [learned, none]
    forbidden: [sinusoidal, fourier, rotary_custom, periodic_custom]
    reason: 周期 3・5・15 の規則を暗黙に漏らす可能性があるため、周期的な位置特徴を禁止する。

head:
  hidden_layers: {min_count: 0, max_count: 2}

training:
  optimizer: [adam, adamw, sgd, rmsprop]
  learning_rate: {min: 1.0e-6, max: 1.0e-1}
  weight_decay: {min: 0.0, max: 0.2}
  batch_size: {allowed: [32, 64, 128]}
  epochs: {min: 1, max: 3}
  momentum: {min: 0.0, max: 0.99}
  gradient_clip_norm: {min: 0.0, max: 100.0}
  label_smoothing: {min: 0.0, max: 0.2}
  scheduler: [none, cosine, step, exponential, plateau]
  loss: [cross_entropy, label_smoothed_cross_entropy]
