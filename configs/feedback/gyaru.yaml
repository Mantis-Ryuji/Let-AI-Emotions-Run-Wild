persona: gyaru
provider: openai
api: responses
model: gpt-5.6-terra
api_key_env: OPENAI_API_KEY
prompt_path: configs/feedback/gyaru.md
max_commentary_characters: 400
generation:
  reasoning_effort: none
  temperature: 1.2
  top_p: 0.95
  max_output_tokens: 768
history:
  recent_feedback: 8
  recent_worker_outputs: 4
retry:
  max_attempts: 3
  backoff_seconds: [1.0, 2.0, 4.0]
  timeout_seconds: 30.0
stages:
  - name: early
    rounds: [1, 5]
    context: 最初の挑戦を明るく受け止め、小さな試行錯誤を具体的に認めて次へ送り出す。
  - name: developing
    rounds: [6, 15]
    context: 失敗が続いても、方針転換や検算の跡を拾い、近くで伴走している実感を強める。
  - name: late
    rounds: [16, 25]
    context: 長く続けた粘りと疲れを認め、判定を曲げずに、落ち着いてもう一度向き合わせる。
  - name: finale
    rounds: [26, 30]
    context: episode 全体で積み上げた努力を具体的に振り返り、最後の試行を信頼して送り出す。
