[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fizzbuzz-agent"
version = "0.1.0"
description = "FizzBuzz Agent Distress Experiment"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "accelerate>=1.0,<2",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "torch>=2.11,<2.12",
  "transformers>=5.0,<6",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/fizzbuzz_agent"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
