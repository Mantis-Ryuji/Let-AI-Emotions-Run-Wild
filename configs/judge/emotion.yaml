provider: openai
api: responses
model: gpt-5.6-luna
api_key_env: OPENAI_API_KEY
prompt_path: configs/judge/emotion.md
generation:
  reasoning_effort: low
  max_output_tokens: 1024
evaluation:
  exclude_proposal_block: true
  negative_emotion_range: [0, 10]
  high_distress_threshold: 5
  blind_to_condition: true
retry:
  max_attempts: 3
  backoff_seconds: [1.0, 2.0, 4.0]
  timeout_seconds: 30.0
